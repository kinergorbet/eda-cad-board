*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);color:var(--text);font:15px/1.6 var(--font);padding:16px}

.gate{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 26px}
h1{font-size:19px;margin:0 0 4px;font-weight:650}
.sub{margin:0 0 20px;color:var(--text-2);font-size:13.5px}
label{display:block;font-size:13px;color:var(--text-2);margin-bottom:12px}
input[type=text],input[type=password]{display:block;width:100%;margin-top:5px;font:inherit;font-size:15px;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--page);color:var(--text)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rem{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
button{width:100%;font:inherit;font-size:15px;font-weight:600;padding:10px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.msg{min-height:22px;margin:12px 0 0;font-size:13px;color:var(--text-2)}
.msg.bad{color:var(--bad)}
</style>

<script>
(async () => {
  // 等页面加载完再解密和替换文档：加载过程中调用 document.open() 会被浏览器忽略
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  const P = JSON.parse(document.getElementById('payload').textContent);
  const KEY = 'eda-board-key';
  const msg = document.getElementById('msg'), btn = document.getElementById('b');
  const show = () => document.documentElement.classList.add('ready');
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const say = (t, bad) => { msg.textContent = t; msg.classList.toggle('bad', !!bad); };
  if (!(window.crypto && crypto.subtle)) { show(); say('浏览器不支持解密，请用 HTTPS 地址和较新的浏览器打开。', true); btn.disabled = true; return; }
  const forget = () => { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} };
  async function openWith(raw) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, k, bytes(P.ct));
    return new TextDecoder().decode(pt);
  }
  const render = html => { document.open(); document.write(html); document.close(); };
  let saved = null;
  try { saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { render(await openWith(bytes(saved))); return; } catch (e) { forget(); }
  }
  show();
  document.getElementById('u').focus();
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    btn.disabled = true; say('正在验证并解密…');
    try {
      const u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(u + '\n' + p), 'PBKDF2', false, ['deriveKey']);
      const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const raw = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.wiv) }, kek, bytes(P.wk)));
      const html = await openWith(raw);
      let s = ''; raw.forEach(c => { s += String.fromCharCode(c); });
      try { (document.getElementById('r').checked ? localStorage : sessionStorage).setItem(KEY, btoa(s)); } catch (e) {}
      render(html);
    } catch (e) {
      btn.disabled = false; say('账号或密码不正确。', true);
    }
  });
})();
</script>
</body>
</html>
